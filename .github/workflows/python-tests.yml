name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_openai_smoke_test:
        description: "Run a live OpenAI API test (uses OPEN_AI_AGENTS secret; may incur API cost)"
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  openai-smoke-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_openai_smoke_test == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify OpenAI API connectivity
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
        run: python scripts/openai_smoke_test.py
